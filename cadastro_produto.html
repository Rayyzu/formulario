<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
</head>
<body background="fundo2.png" bgcolor="#fde8f7">
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center" height="120">
                <font color="#9b4fa2" size="6"><b>Cadastro de Produto</b></font><br>
                <font color="#7f3f80" size="3">Registre um novo item para a loja</font>
            </td>
        </tr>
        <tr><td height="20"></td></tr>
        <tr>
            <td align="center">
                <table width="620" cellpadding="20" cellspacing="0" border="0" bgcolor="#fff0fb">
                    <tr>
                        <td align="center">
                            <p><font color="#6f3a76">Preencha os dados abaixo e clique em Cadastrar para voltar à página principal.</font></p>
                            <form action="principal.html" method="get">
                                <label><b>Nome do produto/item:</b></label><br>
                                <input type="text" size="40"><br><br>

                                <label><b>Descrição:</b></label><br>
                                <textarea rows="4" cols="40"></textarea><br><br>

                                <label><b>Unidade de medida:</b></label><br>
                                <input type="text" size="40"><br><br>

                                <label><b>Quantidade:</b></label><br>
                                <input type="number" size="40"><br><br>

                                <label><b>Valor:</b></label><br>
                                <input type="text" size="40"><br><br>

                                <button type="submit">Cadastrar</button>
                                <button type="reset">Limpar</button>
                            </form>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr><td height="20"></td></tr>
        <tr>
            <td align="center">
                <a href="principal.html"><button>Voltar à Página Principal</button></a>
            </td>
        </tr>
    </table>
</body>
</html>
